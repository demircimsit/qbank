<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9ECE7">
<title>Question Bank</title>
<style>
  :root{
    --bg:#E9ECE7; --panel:#fff; --ink:#14181A; --muted:#5E6862;
    --rule:#CCD3CC; --accent:#0E4B54; --mark:#B07C12;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-text-size-adjust:100%}
  .wrap{max-width:780px;margin:0 auto;padding:0 16px 80px}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
       text-transform:uppercase;color:var(--muted)}
  header{position:sticky;top:0;z-index:20;background:var(--bg);
         padding:18px 0 12px;border-bottom:1px solid var(--rule)}
  .row{display:flex;align-items:baseline;justify-content:space-between}
  input[type=text], textarea{width:100%;border:1px solid var(--rule);background:var(--panel);
    color:var(--ink);outline:none;font-size:16px;padding:11px 12px;border-radius:0}
  textarea{font-family:var(--mono);font-size:12px;line-height:1.5;resize:vertical}
  input[type=text]:focus,textarea:focus{border-color:var(--accent)}
  .chips{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
        white-space:nowrap;padding:6px 10px;border:1px solid var(--rule);background:transparent;
        color:var(--muted);cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
       padding:10px 13px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);
       cursor:pointer}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:focus-visible,.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card{background:var(--panel);border:1px solid var(--rule);margin-bottom:12px}
  .cardhead{display:block;width:100%;text-align:left;padding:14px;background:none;border:none;cursor:pointer;font:inherit}
  .title{font-family:var(--serif);font-size:18px;line-height:1.35;margin-top:6px}
  .qa{border-left:2px solid var(--accent);padding-left:12px;margin-bottom:18px}
  .qa.plain{border-left-color:var(--rule)}
  .q{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.4}
  .a{font-size:15px;line-height:1.65;color:#2A3230;margin:7px 0 0}
  .link{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--mark);display:block;margin-bottom:14px;text-decoration:none}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;border-top:1px solid var(--rule);padding-top:16px}
  .ghost{background:none;border:none;padding:0;cursor:pointer}
  mark{background:#F4E2B0;color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row">
      <div class="lbl" style="color:var(--accent)">Question Bank</div>
      <div class="lbl" id="count">0 videos</div>
    </div>
    <input type="text" id="search" placeholder="Search questions and answers" style="margin-top:10px">
    <div class="chips" id="chips"></div>
    <div class="lbl" id="hits" style="margin-top:8px;display:none"></div>
    <div class="lbl" id="status" style="margin-top:8px"></div>
  </header>

  <div style="margin-top:16px">
    <button class="btn" id="addBtn" style="width:100%">+ Add video</button>
    <div id="addPanel" style="display:none;background:var(--panel);border:1px solid var(--rule);padding:14px">
      <div class="lbl">Paste Gem output</div>
      <textarea id="draft" rows="8" style="margin-top:8px"
        placeholder="Video title | Date | Job area&#10;https://youtube.com/...&#10;&#10;**Question?**&#10;Answer summary."></textarea>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn solid" id="saveBtn">Add to bank</button>
        <button class="btn" id="cancelBtn">Cancel</button>
      </div>
    </div>
    <div class="lbl" id="note" style="margin-top:8px;color:var(--mark)"></div>
  </div>

  <div id="list" style="margin-top:22px"></div>

  <div class="bar" id="bar" style="display:none">
    <button class="btn" id="sortBtn">Newest first</button>
    <button class="btn" id="refreshBtn">Refresh</button>
    <button class="btn" id="mdBtn">Export .md</button>
    <button class="btn" id="jsonBtn">Export .json</button>
    <button class="btn" id="importBtn">Import .json</button>
    <button class="btn" id="keyBtn">Connect key</button>
    <input type="file" id="file" accept="application/json,.json" style="display:none">
  </div>
</div>

<script>
const REPO   = { owner:"demircimsit", name:"qbank", path:"data.json", branch:"main" };
const KEY    = "qabank.cache.v2";
const TOKKEY = "qabank.token.v2";

let entries = [], newestFirst = true, openMap = {}, area = "All", query = "", editId = null;
let sha = null, token = null, live = false, busy = false;

/* ---------- text <-> base64, unicode safe ---------- */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob((b64||"").replace(/\s/g,""));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------- the shared copy on GitHub ---------- */
const apiUrl = () =>
  "https://api.github.com/repos/"+REPO.owner+"/"+REPO.name+"/contents/"+REPO.path+
  "?ref="+REPO.branch+"&t="+Date.now();

function headers(){
  const h = { "Accept":"application/vnd.github+json" };
  if(token) h["Authorization"] = "Bearer " + token;
  return h;
}

async function pull(){
  const r = await fetch(apiUrl(), { headers: headers(), cache:"no-store" });
  if(r.status === 404){ sha = null; return []; }
  if(!r.ok) throw new Error("read failed " + r.status);
  const j = await r.json();
  sha = j.sha;
  const v = JSON.parse(b64dec(j.content) || "[]");
  return Array.isArray(v) ? v : [];
}

async function push(){
  const body = {
    message: "update bank",
    content: b64enc(JSON.stringify(entries, null, 1)),
    branch: REPO.branch
  };
  if(sha) body.sha = sha;
  const url = "https://api.github.com/repos/"+REPO.owner+"/"+REPO.name+"/contents/"+REPO.path;
  let r = await fetch(url, { method:"PUT", headers: headers(), body: JSON.stringify(body) });
  if(r.status === 409 || r.status === 422){
    await pull();
    if(sha) body.sha = sha; else delete body.sha;
    r = await fetch(url, { method:"PUT", headers: headers(), body: JSON.stringify(body) });
  }
  if(!r.ok) throw new Error("save failed " + r.status);
  const j = await r.json();
  sha = j.content && j.content.sha;
}

/* ---------- status line ---------- */
function status(msg){
  const el = document.getElementById("status");
  if(!el) return;
  if(msg){ el.textContent = msg; return; }
  el.textContent = busy ? "Saving\u2026"
    : token && live ? "Connected \u00B7 changes go live for everyone"
    : live ? "Read only \u00B7 connect your key to make changes"
    : "Offline \u00B7 showing the last copy this device saw";
}

/* ---------- local cache, so it still opens with no signal ---------- */
function cacheSave(){
  try{ localStorage.setItem(KEY, JSON.stringify(entries)); }catch(e){}
}
function cacheLoad(){
  try{ const v = JSON.parse(localStorage.getItem(KEY) || "null");
       return Array.isArray(v) ? v : []; }catch(e){ return []; }
}

/* every change goes through here */
async function persist(msg){
  cacheSave();
  if(!token){ note(msg ? msg + " Saved on this device only." : ""); status(); return; }
  busy = true; status(); note(msg || "");
  try{ await push(); note((msg||"") + " Live."); }
  catch(e){ note("Saved here, but could not reach GitHub. Press Refresh and try again."); }
  busy = false; status();
}

async function boot(){
  try{ token = localStorage.getItem(TOKKEY) || null; }catch(e){}
  entries = cacheLoad(); migrate(); render(); status("Loading\u2026");
  try{ entries = await pull(); live = true; migrate(); cacheSave(); }
  catch(e){ live = false; }
  status(); render();
}

/* Old entries listed job areas on their own line and often more than one.
   Pull the first area up into the header and keep only that one. */
function firstArea(s){
  return (s||"")
    .replace(/^job\s*areas?\s*[:\-]\s*/i,"")
    .split(/\s*[,;|\u00B7\/>]\s*/)[0].trim();
}
function migrate(){
  let changed = false;
  entries.forEach(e=>{
    if(!e.area && e.blocks && e.blocks.length && !e.blocks[0].q){
      const txt = (e.blocks[0].a||[]).join(" ").trim();
      if(txt && txt.length < 90 && !/[.?!]$/.test(txt) && !/^https?:/i.test(txt)){
        e.area = firstArea(txt); e.blocks.shift(); changed = true;
      }
    }
    const fa = firstArea(e.area);
    if(fa !== (e.area||"")){ e.area = fa; changed = true; }
  });
  if(changed) cacheSave();
}

/* ---------- parsing ---------- */
const stripMd = s => s.replace(/\*\*/g,"").replace(/__/g,"")
  .replace(/^#+\s*/,"").replace(/^[-*\u2022]\s+/,"").trim();
const urlIn = l => (l.match(/https?:\/\/[^\s)\]>]+/)||[null])[0];
function isUrlLine(l){
  const t = l.trim().replace(/^[-*>\s]+/,"");
  if(!t) return false;
  return /^https?:\/\/\S+$/.test(t)
      || /^\[[^\]]*\]\(https?:\/\/[^)]+\)$/.test(t)
      || /^(link|url|watch)\s*[:\-]\s*https?:\/\/\S+$/i.test(t);
}
function parseHeader(line){
  const parts = stripMd(line).split(/\s*[|\u00B7]\s*|\s+\u2014\s+/).map(p=>p.trim()).filter(Boolean);
  return { title: parts[0]||"Untitled", date: parts[1]||"", area: firstArea(parts[2]||"") };
}
function parseBlocks(lines){
  const out = []; let cur = null;
  for(const raw of lines){
    const line = raw.trim();
    if(!line || /^[-\u2013\u2014_*]{3,}$/.test(line)) continue;
    const bold = /^\*\*(.+?)\*\*:?$/.exec(line);
    const head = /^#{1,6}\s+(.+)$/.exec(line);
    const label = bold ? bold[1] : head ? head[1] : null;
    if(label){ if(cur) out.push(cur); cur = { q: stripMd(label), a: [] }; }
    else if(!cur){ out.push({ q:null, a:[stripMd(line)] }); }
    else cur.a.push(stripMd(line));
  }
  if(cur) out.push(cur);
  return out.filter(b=>b.q||b.a.length);
}
function parseEntries(text){
  const lines = text.split(/\r?\n/), marks = [];
  for(let i=0;i<lines.length;i++){
    if(!isUrlLine(lines[i])) continue;
    let j=i-1; while(j>=0 && !lines[j].trim()) j--;
    marks.push({u:i, h: j>=0 ? j : null});
  }
  return marks.map((m,k)=>{
    const next = marks[k+1];
    const stop = next ? (next.h!==null?next.h:next.u) : lines.length;
    const meta = m.h!==null ? parseHeader(lines[m.h]) : {title:"Untitled",date:"",area:""};
    return Object.assign({
      id: Date.now()+"-"+k+"-"+Math.random().toString(36).slice(2,7),
      url: urlIn(lines[m.u])||"",
      blocks: parseBlocks(lines.slice(m.u+1, stop)),
      added: new Date().toISOString()
    }, meta);
  });
}

/* ---------- helpers ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(s){
  const t = esc(s);
  if(!query) return t;
  const rx = new RegExp("("+query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  return t.replace(rx,"<mark>$1</mark>");
}
function note(msg){ document.getElementById("note").textContent = msg||""; }
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text],{type}));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function entryToMd(e){
  const head = [e.title,e.date,e.area].filter(Boolean).join(" | ");
  const body = e.blocks.map(b=>[b.q?("**"+b.q+"**"):null].concat(b.a).filter(Boolean).join("\n")).join("\n\n");
  return "**"+head+"**\n"+e.url+"\n\n"+body+"\n";
}
function toMarkdown(){ return entries.map(entryToMd).join("\n---\n\n"); }

/* ---------- render ---------- */
function render(){
  const q = query.toLowerCase();
  document.getElementById("count").textContent = entries.length + (entries.length===1?" video":" videos");

  const areaSet = [...new Set(entries.map(e=>(e.area||"").split(" \u00B7 ")[0]).filter(Boolean))].sort();
  document.getElementById("chips").innerHTML = ["All",...areaSet]
    .map(a=>'<button class="chip'+(a===area?" on":"")+'" data-area="'+esc(a)+'">'+esc(a)+"</button>").join("");

  let list = entries.filter(e => area==="All" || (e.area||"").indexOf(area)===0);
  if(q) list = list.filter(e =>
    [e.title,e.area].concat(e.blocks.flatMap(b=>[b.q||""].concat(b.a))).join(" ").toLowerCase().includes(q));
  if(newestFirst) list = list.slice().reverse();

  const hitsEl = document.getElementById("hits");
  if(q){
    hitsEl.style.display=""; hitsEl.textContent = "matches in "+list.length+(list.length===1?" video":" videos");
  } else hitsEl.style.display="none";

  document.getElementById("bar").style.display = entries.length ? "flex" : "none";

  const el = document.getElementById("list");
  if(!entries.length){
    el.innerHTML = '<div class="card" style="padding:20px"><div style="font-family:var(--serif);font-size:19px;line-height:1.4">The bank is empty.</div>'+
      '<p style="color:var(--muted);font-size:14px;margin-top:8px;line-height:1.6">Tap Add video and paste your whole master.md at once to bring the old entries across. After that, one Gem output per paste.</p></div>';
    return;
  }

  el.innerHTML = list.map((e,i)=>{
    const isOpen = (e.id in openMap) ? openMap[e.id] : (!!q || list.length===1);
    const blocks = q ? e.blocks.filter(b=>[b.q||""].concat(b.a).join(" ").toLowerCase().includes(q)) : e.blocks;
    const idx = String(newestFirst ? list.length-i : i+1).padStart(2,"0");
    const meta = [idx, e.date, e.area].filter(Boolean).join(" \u00B7 ");
    return '<article class="card">'+
      '<button class="cardhead" data-id="'+e.id+'">'+
        '<div class="lbl" style="color:var(--accent)">'+esc(meta)+'</div>'+
        '<div class="title">'+hl(e.title)+'</div>'+
        '<div class="lbl" style="margin-top:8px">'+(isOpen?"hide":"open")+'</div>'+
      '</button>'+
      (isOpen ? '<div style="padding:0 14px 16px">'+
        (editId===e.id
          ? '<div class="lbl">Editing \u00B7 line 1 is title | date | job area</div>'+
            '<textarea id="editBox" rows="14" style="margin-top:8px">'+esc(entryToMd(e))+'</textarea>'+
            '<div style="display:flex;gap:8px;margin-top:10px">'+
              '<button class="btn solid" data-savedit="'+e.id+'">Save changes</button>'+
              '<button class="btn" data-canceledit="1">Cancel</button>'+
            '</div>'
          : (e.url?'<a class="link" href="'+esc(e.url)+'" target="_blank" rel="noreferrer">Watch \u2197</a>':"")+
            blocks.map(b=>'<div class="qa'+(b.q?"":" plain")+'">'+
              (b.q?'<div class="q">'+hl(b.q)+'</div>':"")+
              b.a.map(p=>'<p class="a">'+hl(p)+'</p>').join("")+
            '</div>').join("")+
            '<div style="display:flex;gap:16px">'+
              '<button class="lbl ghost" data-edit="'+e.id+'">Edit entry</button>'+
              '<button class="lbl ghost" data-del="'+e.id+'">Delete entry</button>'+
            '</div>')+
      '</div>' : "")+
    '</article>';
  }).join("");
}

/* ---------- events ---------- */
document.getElementById("search").addEventListener("input", e=>{ query=e.target.value.trim(); render(); });
document.getElementById("chips").addEventListener("click", e=>{
  const b=e.target.closest(".chip"); if(!b) return; area=b.dataset.area; render();
});
document.getElementById("list").addEventListener("click", e=>{
  const del=e.target.closest("[data-del]");
  if(del){ entries=entries.filter(x=>x.id!==del.dataset.del); render(); persist("Entry removed."); return; }

  const ed=e.target.closest("[data-edit]");
  if(ed){ editId=ed.dataset.edit; openMap[editId]=true; note(""); render();
          const t=document.getElementById("editBox"); if(t) t.focus(); return; }

  if(e.target.closest("[data-canceledit]")){ editId=null; note(""); render(); return; }

  const sv=e.target.closest("[data-savedit]");
  if(sv){
    const box=document.getElementById("editBox");
    const parsed=parseEntries(box?box.value:"");
    if(!parsed.length){ note("Could not save. Keep the title line, then the link line below it."); return; }
    const i=entries.findIndex(x=>x.id===sv.dataset.savedit);
    if(i<0){ note("Entry no longer exists."); editId=null; render(); return; }
    const kept=Object.assign({}, parsed[0], {id:entries[i].id, added:entries[i].added});
    entries.splice(i,1,kept);
    if(parsed.length>1) entries.splice(i+1,0,...parsed.slice(1));
    migrate(); editId=null; render(); persist("Changes saved."); return;
  }
  const h=e.target.closest(".cardhead");
  if(h){ const id=h.dataset.id;
    const cur=(id in openMap)?openMap[id]:(!!query);
    openMap[id]=!cur; render(); }
});
document.getElementById("addBtn").addEventListener("click", ()=>{
  document.getElementById("addPanel").style.display="block";
  document.getElementById("addBtn").style.display="none";
  document.getElementById("draft").focus();
});
document.getElementById("cancelBtn").addEventListener("click", ()=>{
  document.getElementById("addPanel").style.display="none";
  document.getElementById("addBtn").style.display="block";
  document.getElementById("draft").value=""; note("");
});
document.getElementById("saveBtn").addEventListener("click", ()=>{
  const parsed = parseEntries(document.getElementById("draft").value);
  if(!parsed.length){ note("No entry found. Each entry needs a title line then a link line."); return; }
  const map = new Map(entries.map(e=>[e.url||e.title,e]));
  let replaced=0;
  parsed.forEach(p=>{ const k=p.url||p.title; if(map.has(k)) replaced++; map.set(k,p); });
  entries=[...map.values()];
  document.getElementById("draft").value="";
  document.getElementById("addPanel").style.display="none";
  document.getElementById("addBtn").style.display="block";
  render();
  persist(parsed.length+" added"+(replaced?", "+replaced+" replaced":"")+".");
});
document.getElementById("sortBtn").addEventListener("click", e=>{
  newestFirst=!newestFirst; e.target.textContent = newestFirst?"Newest first":"Oldest first"; render();
});
document.getElementById("keyBtn").addEventListener("click", ()=>{
  const has = !!token;
  const v = prompt(has
    ? "Your key is already saved on this device.\n\nPaste a new one to replace it, or leave blank and press OK to disconnect."
    : "Paste your GitHub key.\n\nIt is kept on this device only and never appears in the published page.");
  if(v === null) return;
  const t = v.trim();
  try{
    if(t){ token = t; localStorage.setItem(TOKKEY, t); note("Key saved. You can now make changes."); }
    else { token = null; localStorage.removeItem(TOKKEY); note("Key removed from this device."); }
  }catch(e){ note("Key active for now, but this browser would not remember it."); }
  status();
});
document.getElementById("refreshBtn").addEventListener("click", async ()=>{
  status("Loading\u2026");
  try{ entries = await pull(); live = true; migrate(); cacheSave(); note("Up to date."); }
  catch(e){ live = false; note("Could not reach GitHub."); }
  status(); render();
});
document.getElementById("mdBtn").addEventListener("click", ()=>download("master.md", toMarkdown(), "text/markdown"));
document.getElementById("jsonBtn").addEventListener("click", ()=>download("qa-bank.json", JSON.stringify(entries,null,2), "application/json"));
document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("file").click());
document.getElementById("file").addEventListener("change", ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const v=JSON.parse(r.result);
      if(!Array.isArray(v)) throw 0;
      const map=new Map(entries.map(e=>[e.url||e.title,e]));
      v.forEach(p=>map.set(p.url||p.title,p));
      entries=[...map.values()]; render(); persist(v.length+" imported.");
    }catch(e){ note("That file could not be read as a bank export."); } };
  r.readAsText(f); ev.target.value="";
});

boot();
</script>
</body>
</html>
